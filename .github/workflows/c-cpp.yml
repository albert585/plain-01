name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install_nasm
      run: sudo apt update && sudo apt install -y nasm xorriso

    - name: make
      run: make

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: plain-01-build
        path: |
          *.iso
          kernel/bin-*/kernel
